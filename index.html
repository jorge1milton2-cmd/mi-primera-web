
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi primera web</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172554;
      text-align: center;
    }
    header {
      background: #142d4e;
      color: white;
      padding: 65px 20px;
    }
    main {
      max-width: 750px;
      margin: 45px auto;
      padding: 30px;
      background: white;
      border-radius: 14px;
    }
    h1 { font-size: 36px; }
    p { line-height: 1.7; color: #475569; }
    footer { padding: 25px; color: #64748b; }
  </style>
</head>
<body>
  <header>
    <h1>¡Mi primera página web!</h1>
    <p>Publicada desde GitHub en mi VPS Hostinger</p>
  </header>

  <main>
    <h2>Bienvenido</h2>
    <p>
      Esta página está alojada en mi propio servidor
      mediante EasyPanel y se actualiza desde GitHub.
    </p>
  </main>

  <footer>
    © 2026 - Mi proyecto web
  </footer>
</body>
</html>
